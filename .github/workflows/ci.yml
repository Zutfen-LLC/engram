name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Always runs, including for documentation-only changes. It keeps the
  # credential scan universal while allowing runtime-independent changes to
  # skip every image build, database boot, and language toolchain setup.
  repository-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime_changed: ${{ steps.changes.outputs.runtime_changed }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for credential leaks
        run: python scripts/scan_credential_leaks.py

      - name: Detect runtime-relevant changes
        id: changes
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PUSH_BASE_SHA: ${{ github.event.before }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$CI_EVENT_NAME" == "pull_request" ]]; then
            comparison_base=$CI_PR_BASE_SHA
            comparison_head=$CI_PR_HEAD_SHA
          else
            comparison_base=$CI_PUSH_BASE_SHA
            comparison_head=$CI_WORKFLOW_SHA
          fi

          if [[ -z "$comparison_base" || "$comparison_base" =~ ^0+$ ]]; then
            runtime_changed=true
          elif git diff --quiet "$comparison_base" "$comparison_head" -- \
            . ':(exclude,glob)**/*.md' ':(exclude,glob)docs/**'; then
            runtime_changed=false
          else
            runtime_changed=true
          fi

          echo "runtime_changed=$runtime_changed" | tee -a "$GITHUB_OUTPUT"

      - name: Validate deployment Compose contract
        if: steps.changes.outputs.runtime_changed == 'true'
        run: bash scripts/validate_compose_contract.sh

  # Each matrix entry runs on a separate hosted runner. This gives every shard
  # an isolated PostgreSQL cluster and prevents file-level cleanup from racing
  # cleanup in another shard.
  compose-real-db-shard:
    name: compose-real-db / shard ${{ matrix.shard_label }}
    needs: repository-safety
    if: needs.repository-safety.outputs.runtime_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_label: 1-of-4
            export_cache: true
          - shard_index: 1
            shard_label: 2-of-4
            export_cache: false
          - shard_index: 2
            shard_label: 3-of-4
            export_cache: false
          - shard_index: 3
            shard_label: 4-of-4
            export_cache: false
    env:
      ENGRAM_CI_IMAGE: engram-ci:${{ github.sha }}
      ENGRAM_CI_MODE: "root-shard"
      ENGRAM_CI_SHARD_INDEX: ${{ matrix.shard_index }}
      ENGRAM_CI_SHARD_COUNT: "4"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Assert workflow checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected workflow SHA: $EXPECTED_SHA"
          echo "Checked out SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ci
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.ENGRAM_CI_IMAGE }}
          cache-from: type=gha,scope=engram-ci
          # All shards read one cache. Only shard zero exports it. Concurrent
          # writes to the same scope waste time and can race. Main populates the
          # full cache. GitHub isolates pull-request writes to the PR ref.
          cache-to: ${{ matrix.export_cache && format('type=gha,mode={0},scope=engram-ci', github.event_name == 'push' && 'max' || 'min') || '' }}
          provenance: false

      - name: Run Compose Real-DB CI Shard
        run: docker compose -f docker-compose.ci.yml up --no-build --abort-on-container-exit --exit-code-from engram-test

      # Must run before the stack is torn down. `docker compose cp` reads from
      # the stopped container, so results survive failures and retain successful
      # timing data for future suite balancing work.
      - name: Export JUnit Test Results
        if: always()
        run: |
          mkdir -p test-results
          docker compose -f docker-compose.ci.yml cp \
            engram-test:/app/test-results/. test-results/ \
            || echo "No test results to export (the suite may not have started)."
          ls -la test-results || true

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-compose-${{ matrix.shard_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Show Compose Logs On Failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Clean Up Compose Stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans

  # Builds and boots the production `runtime` image. Every other job builds the
  # `ci` target only, so without this a broken `pip install .`, a runtime
  # dependency that only the dev extras were providing, or a broken uvicorn
  # entrypoint reaches main undetected.
  runtime-image-smoke:
    needs: repository-safety
    if: needs.repository-safety.outputs.runtime_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENGRAM_RUNTIME_IMAGE: engram-runtime:${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.ENGRAM_RUNTIME_IMAGE }}
          cache-from: type=gha,scope=engram-runtime
          cache-to: type=gha,mode=${{ github.event_name == 'push' && 'max' || 'min' }},scope=engram-runtime
          provenance: false

      - name: Verify the non-editable install imports and exposes its entrypoint
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "$ENGRAM_RUNTIME_IMAGE" \
            -c "import engram.api.app, engram.cli; print('package imports OK')"
          docker run --rm --entrypoint engram "$ENGRAM_RUNTIME_IMAGE" --help > /dev/null
          echo "console script OK"

      - name: Boot the runtime image against a real database
        run: |
          docker compose -f docker-compose.ci.yml --profile smoke up -d --wait \
            --wait-timeout 180 engram-runtime-smoke

      - name: Assert liveness and readiness
        run: |
          set -euo pipefail

          probe() {
            path=$1
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' "http://localhost:8000$path")
            echo "GET $path -> $code"
            cat /tmp/probe.json
            echo
            test "$code" = "200"
          }

          probe /health
          # /ready is the load-bearing assertion: it proves the production image
          # reached Postgres as the non-owner app role under FORCE RLS, resolved
          # a tenant context, and found pgvector >= 0.8.
          probe /ready

      - name: Show Smoke Logs On Failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml --profile smoke logs --no-color

      - name: Clean Up Smoke Stack
        if: always()
        run: docker compose -f docker-compose.ci.yml --profile smoke down -v --remove-orphans

  # DB-free Python checks share one environment with lock and conformance
  # checks. This job runs in parallel with the real-DB shards.
  conformance-vectors:
    needs: repository-safety
    if: needs.repository-safety.outputs.runtime_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENGRAM_CI_RESULTS_DIR: test-results

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"

      - name: Verify lock and install pinned verifier dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-packages --all-extras

      - name: Run Python preflight
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/python scripts/run_ci.py --mode preflight

      - name: Upload preflight JUnit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify vectors (Python)
        run: .venv/bin/python scripts/verify_context_manifest_vectors.py

      - name: Verify vectors (JavaScript, independent RFC 8785 + SHA-256)
        run: node conformance/context-manifest-v1/verify.mjs

      # The driver invokes each negative verifier exactly once and checks that
      # both languages reject the same non-empty fixture set.
      - name: Verify negative fixtures cross-language
        run: .venv/bin/python conformance/context-manifest-v1/run_cross_language.py

  # Keep the existing required-check name stable. This job also ensures the
  # DB-free checks remain part of the same merge gate as the real-DB shards.
  compose-real-db:
    name: compose-real-db
    needs:
      - repository-safety
      - compose-real-db-shard
      - conformance-vectors
    if: always() && needs.repository-safety.outputs.runtime_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify all Compose Real-DB shards and preflight checks
        env:
          SHARD_RESULT: ${{ needs.compose-real-db-shard.result }}
          PREFLIGHT_RESULT: ${{ needs.conformance-vectors.result }}
        run: |
          set -euo pipefail
          echo "Real-DB shards: $SHARD_RESULT"
          echo "Preflight and conformance: $PREFLIGHT_RESULT"
          test "$SHARD_RESULT" = "success"
          test "$PREFLIGHT_RESULT" = "success"
