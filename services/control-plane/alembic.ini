# Alembic configuration for the Engram Control Plane (ENG-PORTAL-001A).
#
# This is a minimal ini; the real configuration (script location, URL) is set
# programmatically by engram_control_plane.cli and engram_control_plane.db so
# the package is portable (no fixed paths/URLs). The ini exists so `alembic`
# can be invoked directly during development if desired.
[alembic]
script_location = engram_control_plane/migrations
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
