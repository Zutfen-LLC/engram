[project]
name = "engram-mcp"
version = "0.1.0"
description = "MCP server adapter exposing Engram memory tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["ai", "agents", "memory", "engram", "mcp", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # The local-dev bootstrap installs the sibling SDK into the same venv first.
    # Keep the runtime dependency as a normal package name so editable installs of
    # this adapter do not depend on a fragile relative file URL during wheel metadata
    # generation.
    "engram-client>=0.1.0",
    # engram_mcp.server imports `mcp.server.fastmcp`, which bounds this range on
    # both sides: the module first appears in 1.2.0 (1.1.3 and earlier lack it)
    # and is removed again in 2.0.0, which replaces it with `mcp.server.mcpserver`.
    # The previous `mcp>=1.0` admitted both broken ends; CI only stayed green
    # because the newest release happened to sit inside the working range, and it
    # broke the moment 2.0.0 shipped. Widening this requires porting the adapter
    # off the FastMCP API.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
engram-mcp = "engram_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Zutfen-LLC/engram"
Repository = "https://github.com/Zutfen-LLC/engram"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engram_mcp*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
