services:
  postgres:
    image: pgvector/pgvector:pg16
    # Durability is worthless here: this cluster is created from the bundled
    # migrations on every run and destroyed with `down -v`. Turning off the
    # write barriers removes the per-commit fsync from ~3000 tests that each
    # commit at least once. max_connections is raised because each test process
    # opens several pooled engines (runtime, owner, read, provisioner) and the
    # default 100 leaves no headroom for running the suite in parallel.
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c max_connections=200
    # PGDATA in RAM. Bounded explicitly so a runaway test cannot exhaust the
    # runner's memory: the seeded cluster is ~40 MB and the service-provisioning
    # suites add a handful of ~8 MB databases, so 2g is generous. Postgres fails
    # loudly on a full data directory rather than corrupting anything.
    tmpfs:
      - /var/lib/postgresql/data:size=2g
    environment:
      POSTGRES_DB: engram
      # Owner/migration superuser (bypasses RLS). The existing test suites run
      # as this role so their cross-table setup/cleanup keeps working.
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      # Non-owner application role, created by 003_app_role_and_force_rls.sql;
      # its password is set on first boot by app_role_password.sh. The RLS
      # isolation tests connect as this role to prove enforcement.
      POSTGRES_APP_USER: engram_app
      POSTGRES_APP_PASSWORD: engram_app
      POSTGRES_PROVISIONER_USER: engram_provisioner
      POSTGRES_PROVISIONER_PASSWORD: engram_provisioner
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 5s
      timeout: 5s
      retries: 20

  engram-test:
    image: ${ENGRAM_CI_IMAGE:-engram-ci:local}
    pull_policy: never
    build:
      context: .
      target: ci
    environment:
      # Root test suites connect as the owner (bypass RLS) — unchanged from the
      # pre-ENG-AUD-002 behavior so cross-table setup/cleanup is unaffected.
      ENGRAM_DATABASE_URL: postgresql+asyncpg://engram:engram@postgres:5432/engram
      ENGRAM_OWNER_DATABASE_URL: postgresql+asyncpg://engram:engram@postgres:5432/engram
      # App-role DSN consumed ONLY by the non-owner RLS isolation tests.
      ENGRAM_APP_DATABASE_URL: postgresql+asyncpg://engram_app:engram_app@postgres:5432/engram
      ENGRAM_AUTH_ENABLED: "false"
      ENGRAM_SERVICE_PROVISIONING_ENABLED: "true"
      ENGRAM_PROVISIONER_DATABASE_URL: postgresql+asyncpg://engram_provisioner:engram_provisioner@postgres:5432/engram
      ENGRAM_FAIL_ON_DB_SKIP: "1"
      ENGRAM_EMBEDDING_PROVIDER: none
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy

  # Production-image smoke check. CI otherwise only ever builds the `ci` target,
  # so the `runtime` target — a different install path (`pip install .`, no dev
  # extras, non-editable) behind a different entrypoint (uvicorn) — could break
  # and reach main undetected.
  #
  # Held behind a Compose profile so it is excluded from the default `up` that
  # runs the test suite; start it with:
  #   docker compose -f docker-compose.ci.yml --profile smoke up -d --wait \
  #       engram-runtime-smoke
  engram-runtime-smoke:
    profiles: ["smoke"]
    image: ${ENGRAM_RUNTIME_IMAGE:-engram-runtime:local}
    pull_policy: never
    build:
      context: .
      target: runtime
    environment:
      # Connect as the non-owner application role under FORCE RLS, exactly as
      # the deployment stack in docker-compose.yml does. This is the one place
      # CI exercises the production role configuration end to end.
      ENGRAM_DATABASE_URL: postgresql+asyncpg://engram_app:engram_app@postgres:5432/engram
      ENGRAM_OWNER_DATABASE_URL: postgresql+asyncpg://engram:engram@postgres:5432/engram
      ENGRAM_EMBEDDING_PROVIDER: none
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Liveness only (/health is DB-free), mirroring docker-compose.yml. The
    # workflow asserts /ready separately so a DB/RLS/pgvector failure surfaces
    # as an explicit assertion instead of a healthcheck timeout.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import sys,urllib.request as u;
          sys.exit(0 if u.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 24
